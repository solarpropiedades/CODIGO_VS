<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solar Propiedades — Admin</title>
  <link rel="icon" type="image/png" href="/fotos/LOGO.PNG"/>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
  (function () {
    var A = '#EE7A13';
    var V = '#36512B';

    function injectCSS() {
      var s = document.getElementById('solar-css');
      if (!s) { s = document.createElement('style'); s.id = 'solar-css'; document.head.appendChild(s); }
      s.textContent = `
        *, *::before, *::after { font-family: 'Inter', sans-serif !important; }
        body { background: #f2f0ea !important; }

        [data-testid="new-button"] {
          background: #EE7A13 !important;
          background-color: #EE7A13 !important;
          border-color: #EE7A13 !important;
          color: #fff !important;
          font-weight: 700 !important;
          text-transform: uppercase !important;
          letter-spacing: .05em !important;
          border-radius: 8px !important;
          display: inline-flex !important;
          align-items: center !important;
          justify-content: center !important;
          text-align: center !important;
        }
        /* Modal de imagenes: los botones venian verde-sobre-verde y no se leian.
           Se fuerza el contraste sin depender de las clases de Decap (son generadas). */
        [class*="MediaLibrary"] button,
        [class*="media-library"] button,
        div[role="dialog"] button {
          color: #fff !important;
        }
        [class*="MediaLibrary"] button *,
        [class*="media-library"] button *,
        div[role="dialog"] button * {
          color: inherit !important;
        }

        [data-testid="new-button"]:hover {
          background: #c9650d !important;
          background-color: #c9650d !important;
        }

        article {
          background: #fff !important;
          border: 1px solid #dedad2 !important;
          border-radius: 10px !important;
          box-shadow: 0 1px 4px rgba(0,0,0,.06) !important;
          overflow: hidden !important;
        }
        article:hover {
          box-shadow: 0 4px 16px rgba(0,0,0,.12) !important;
          transform: translateY(-2px) !important;
        }

        input, textarea, select {
          background: #fff !important; border: 1.5px solid #dedad2 !important;
          border-radius: 7px !important; color: #111 !important; font-size: 14px !important;
        }
        input:focus, textarea:focus, select:focus {
          border-color: #EE7A13 !important;
          box-shadow: 0 0 0 3px rgba(238,122,19,.15) !important;
          outline: none !important;
        }
        textarea { min-height: 120px !important; resize: vertical !important; }
        label { color: #36512B !important; font-size: 11px !important; font-weight: 600 !important; letter-spacing: .07em !important; text-transform: uppercase !important; }
        [class*="Toolbar"] { background: #f0ede4 !important; border-bottom: 1px solid #dedad2 !important; border-radius: 7px 7px 0 0 !important; }
        [class*="Toolbar"] button { color: #36512B !important; background: transparent !important; border: none !important; border-radius: 4px !important; }
        [class*="Toolbar"] button:hover { background: rgba(238,122,19,.15) !important; color: #EE7A13 !important; }

        .solar-thumb { width: 100%; height: 160px; object-fit: cover; display: block; border-bottom: 1px solid #dedad2; }
        .solar-nophoto { width: 100%; height: 60px; background: #f5f3ee; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #dedad2; color: #ccc; font-size: 11px; }

        * { scrollbar-width: thin; scrollbar-color: #EE7A13 transparent; }
        ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #EE7A13; border-radius: 3px; }
      `;
    }

    var propCache = {}, propFetching = {};
    function fetchProp(slug, cb) {
      if (propCache[slug]) { cb(propCache[slug]); return; }
      if (propFetching[slug]) return;
      propFetching[slug] = true;
      var base = location.hostname === 'localhost' ? location.origin : 'https://raw.githubusercontent.com/solarpropiedades/CODIGO_VS/main';
      fetch(base + '/content/propiedades/' + slug + '.md')
        .then(function(r) { return r.ok ? r.text() : Promise.reject(); })
        .then(function(txt) {
          propCache[slug] = {
            // Decap guarda 'fotos' como lista si hay varias y como texto si hay una sola
            foto: ((txt.match(/fotos:\s*\n\s*-\s*(\S+)/)
                 || txt.match(/^fotos:[ \t]+(\S+)[ \t]*$/m) || [])[1] || '').trim(),
            tipo: ((txt.match(/^tipo:\s*(.+)$/m) || [])[1] || '').trim().replace(/^["']|["']$/g, '')
          };
          cb(propCache[slug]);
        })
        .catch(function() { propCache[slug] = { foto:'', tipo:'' }; cb(propCache[slug]); });
    }

    var hdrDone = false;
    function styleHeader() {
      if (hdrDone) return;
      var found = null;
      Array.from(document.querySelectorAll('[data-testid="header"],header,body>div>div,body>div')).some(function(el) {
        var r = el.getBoundingClientRect();
        if (r.top <= 4 && r.height > 20 && r.height < 120 && r.width > window.innerWidth * 0.7) { found = el; return true; }
      });
      if (!found) return;
      found.style.setProperty('background', V, 'important');
      found.style.setProperty('background-color', V, 'important');
      found.style.setProperty('box-shadow', '0 1px 8px rgba(0,0,0,.25)', 'important');
      /* Ocultar solo la pestaña Medios (Contenido se mantiene) */
      Array.from(found.querySelectorAll('a,li,span,button')).forEach(function(el) {
        var t = (el.textContent||'').trim();
        if (['Medios','Media'].indexOf(t) !== -1) {
          (el.closest('li') || el.closest('a') || el).style.setProperty('display','none','important');
        }
      });
      hdrDone = true;
    }

    function applyRepeating() {
      /* Ocultar SOLO "Añadir rápido" y la pestaña "Medios"
         (específico, para NO tocar otros botones con la palabra "Añadir") */
      Array.from(document.querySelectorAll('button,a,[role="button"],span,div,li')).forEach(function(el) {
        if (el.children.length > 2) return; // solo elementos hoja/chicos
        var t = (el.textContent||'').trim();
        if (!t || t.length > 22) return;
        if (/a[ñn]adir\s+r[áa]pido/i.test(t) || /quick\s*add/i.test(t)) {
          var btn = el.closest('button') || el.closest('a') || el.closest('[role="button"]') || el;
          btn.style.setProperty('display','none','important');
        }
        if (/^(medios|media)$/i.test(t)) {
          var tab = el.closest('a') || el.closest('li') || el;
          tab.style.setProperty('display','none','important');
        }
      });

      /* Botón "Nueva Propiedad" / "+ Propiedad": corrige texto Y lo pinta de NARANJA (robusto por texto) */
      Array.from(document.querySelectorAll('button, a, [role="button"]')).forEach(function(el) {
        var _t = (el.textContent || '').trim();
        // Agarra "Nueva/Nuevo Propiedad", "+ Propiedad", "Propiedad", "New/+ Property" — pero NO títulos largos
        if (!/Nuev[oa] Propiedad/.test(_t) && !/^\+?\s*Propiedad$/.test(_t) && !/^\+?\s*(New\s+)?Property$/i.test(_t)) return;
        var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), tn;
        while (tn = w.nextNode()) {
          if (tn.nodeValue && tn.nodeValue.indexOf('Nuevo') !== -1) tn.nodeValue = tn.nodeValue.replace(/Nuevo/g, 'Nueva');
        }
        el.style.setProperty('background', A, 'important');
        el.style.setProperty('background-color', A, 'important');
        el.style.setProperty('border-color', A, 'important');
        el.style.setProperty('color', '#fff', 'important');
        el.style.setProperty('font-weight', '700', 'important');
        el.style.setProperty('border-radius', '8px', 'important');
      });

      /* Subida de fotos: permitir elegir VARIAS a la vez en el selector de archivos */
      Array.from(document.querySelectorAll('input[type="file"]')).forEach(function(inp) {
        inp.setAttribute('multiple', 'multiple'); inp.multiple = true;
      });
      /* ---- Limpieza del selector de imágenes ----
         Decap muestra muchos botones que Antonella no necesita y que solo confunden
         (subir por URL, copiar la ruta, descargar, borrar del repo). Se ocultan y se
         deja UNO principal bien visible: "Subir nuevo". */
      var OCULTAR = [
        /reemplazar con url/i, /replace with url/i, /insertar desde url/i, /insert from url/i,
        /^copy$/i, /^copiar$/i,
        /^descargar$/i, /^download$/i,
        /eliminar selecci[óo]n/i, /delete selected/i
      ];
      Array.from(document.querySelectorAll(
        'button, a, label, [role="button"], [class*="utton"]'
      )).forEach(function(b) {
        var t = (b.textContent || '').trim();
        if (!t || t.length > 30) return;
        if (OCULTAR.some(function(re) { return re.test(t); })) {
          b.style.setProperty('display', 'none', 'important');
        }
      });

      /* Botones de acción en NARANJA con letra blanca (antes eran azul/verde sobre
         fondo oscuro y no se leían).
         El selector es amplio a proposito: Decap arma algunos de estos botones como
         <label> o <div>, no como <button>, y por eso antes se escapaban. */
      var PRINCIPALES = [
        /subir nuevo/i, /^upload$/i, /^subir$/i,
        /elige una imagen/i, /choose an image/i, /^elegir imagen$/i,
        /confirmar selecci[óo]n/i, /choose selected/i
      ];
      Array.from(document.querySelectorAll(
        'button, a, label, [role="button"], input[type="submit"], [class*="utton"]'
      )).forEach(function(b) {
        var t = (b.textContent || b.value || '').trim();
        if (!t || t.length > 30) return;
        if (!PRINCIPALES.some(function(re) { return re.test(t); })) return;
        b.style.setProperty('background', A, 'important');
        b.style.setProperty('background-color', A, 'important');
        b.style.setProperty('border', 'none', 'important');
        b.style.setProperty('color', '#fff', 'important');
        b.style.setProperty('font-weight', '700', 'important');
        b.style.setProperty('border-radius', '8px', 'important');
        b.style.setProperty('text-shadow', 'none', 'important');
        b.style.setProperty('opacity', '1', 'important');
        /* Decap a veces pinta el texto en un <span> hijo: se fuerza ahí también */
        Array.from(b.querySelectorAll('*')).forEach(function(c) {
          c.style.setProperty('color', '#fff', 'important');
        });
      });

      /* "Quita la imagen": que se lea, pero discreto (es una acción destructiva) */
      Array.from(document.querySelectorAll('button, a, [role="button"]')).forEach(function(b) {
        var t = (b.textContent || '').trim();
        if (!/quita la imagen/i.test(t) && !/remove image/i.test(t)) return;
        b.style.setProperty('background', 'transparent', 'important');
        b.style.setProperty('color', '#b3261e', 'important');
        b.style.setProperty('font-weight', '600', 'important');
      });

      /* Botón naranja */
      var nb = document.querySelector('[data-testid="new-button"]');
      if (nb) {
        nb.style.setProperty('background',       A, 'important');
        nb.style.setProperty('background-color', A, 'important');
        nb.style.setProperty('border-color',     A, 'important');
        nb.style.setProperty('color',            '#fff', 'important');
        nb.style.setProperty('font-weight',      '700', 'important');
        nb.style.setProperty('text-transform',   'uppercase', 'important');
        nb.style.setProperty('border-radius',    '8px', 'important');
        /* "Nuevo Propiedad" → "Nueva Propiedad" (recorre nodos de texto, incluso los
           sueltos junto al ícono, que el método anterior no agarraba) */
        var w = document.createTreeWalker(nb, NodeFilter.SHOW_TEXT, null);
        var tn;
        while (tn = w.nextNode()) {
          if (tn.nodeValue && tn.nodeValue.indexOf('Nuevo') !== -1)
            tn.nodeValue = tn.nodeValue.replace(/Nuevo/g, 'Nueva');
        }
        /* Lock */
        if (!nb.dataset.locked) {
          nb.dataset.locked = '1';
          new MutationObserver(function() {
            nb.style.setProperty('background',       A, 'important');
            nb.style.setProperty('background-color', A, 'important');
            nb.style.setProperty('color',            '#fff', 'important');
          }).observe(nb, { attributes:true, attributeFilter:['style','class'] });
        }
      }

      /* Cards */
      Array.from(document.querySelectorAll('article')).forEach(function(card) {
        if (!card.dataset.codeOk) {
          Array.from(card.querySelectorAll('p,span,div')).some(function(el) {
            if (el.dataset.solarDone) return false;
            var t = (el.innerText||el.textContent||'').trim();
            if (!t||t.length>150) return false;
            var m = t.match(/^([A-Z]{2,4}-\d{2,4})\b/);
            if (!m) return false;
            el.dataset.solarDone='1'; card.dataset.codeOk='1';
            el.innerHTML='<span style="color:'+A+';font-weight:700;letter-spacing:.04em;font-size:13px">'+m[1]+'</span><span style="color:#555;font-weight:500">'+t.slice(m[1].length)+'</span>';
            return true;
          });
        }
        if (card.querySelector('.solar-thumb,.solar-nophoto')) return;
        var link = card.querySelector('a[href]');
        if (!link) return;
        var slug = (link.getAttribute('href')||'').split('/').pop();
        if (!slug||slug.length<2) return;
        (function(s,c) {
          fetchProp(s, function(p) {
            if (c.querySelector('.solar-thumb,.solar-nophoto')) return;
            if (p.foto) {
              var img=document.createElement('img'); img.className='solar-thumb'; img.src=p.foto; img.alt=s;
              c.insertBefore(img,c.firstChild);
            } else {
              var ph=document.createElement('div'); ph.className='solar-nophoto'; ph.textContent='Sin foto';
              c.insertBefore(ph,c.firstChild);
            }
          });
        })(slug,card);
      });
    }

    function run() { injectCSS(); styleHeader(); applyRepeating(); }

    /* Observar solo el body, no el head (evita loop infinito) */
    var pending = false;
    new MutationObserver(function() {
      if (pending) return;
      pending = true;
      setTimeout(function() { pending = false; styleHeader(); applyRepeating(); }, 150);
    }).observe(document.body || document.documentElement, { childList:true, subtree:true });

    window.addEventListener('load', function() {
      setTimeout(function() { injectCSS(); run(); }, 100);
      [400,900,1800,3500].forEach(function(ms){ setTimeout(run,ms); });
      setInterval(function(){ styleHeader(); applyRepeating(); }, 1000);
    });
  })();
  </script>

  <!-- ── VISTA PREVIA EN VIVO: la propiedad como se ve en el sitio ── -->
  <script>
  (function () {
    if (!window.CMS || !window.h || !window.createClass) return;
    var h = window.h, createClass = window.createClass;

    function fmtPrecio(precio, moneda, tipo, periodo) {
      var n = Number(precio);
      if (isNaN(n)) return precio || '';
      var esAlq = tipo && String(tipo).toLowerCase().indexOf('alquiler') !== -1;
      var per = '';
      if (esAlq) {
        per = String(periodo || '').trim().replace(/^\/+\s*/, '').replace(/^por\s+/i, '').trim() || 'mes';
      }
      return (moneda === 'ARS' ? '$ ' : 'U$S ') + n.toLocaleString('es-AR') + (per ? ' / ' + per : '');
    }

    // Render simple de la descripción: viñetas para "- " y párrafos para el resto
    function renderDesc(md) {
      if (!md) return null;
      var out = [], list = null;
      String(md).split('\n').forEach(function (ln) {
        var t = ln.trim();
        if (/^[-*]\s+/.test(t)) {
          if (!list) list = [];
          list.push(h('li', {}, t.replace(/^[-*]\s+/, '')));
        } else {
          if (list) { out.push(h('ul', {}, list)); list = null; }
          if (t) out.push(h('p', {}, t));
        }
      });
      if (list) out.push(h('ul', {}, list));
      return out;
    }

    // Convierte un valor (texto "a, b" o lista YAML vieja) a array
    function toArr(v) {
      if (v == null) return [];
      if (typeof v === 'string') return v.split(/[\n,]+/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (v.toArray) return v.toArray().map(function (x) { return String(x).trim(); }).filter(Boolean);
      if (Array.isArray(v)) return v.map(function (x) { return String(x).trim(); }).filter(Boolean);
      return [];
    }
    function chipGroup(titulo, v) {
      var items = toArr(v); if (!items.length) return null;
      return h('div', { className: 'sp-group' }, [
        h('div', { className: 'sp-group-t' }, titulo),
        h('div', { className: 'sp-tags' }, items.map(function (t) { return h('span', { className: 'sp-tag' }, t); }))
      ]);
    }

    var Preview = createClass({
      render: function () {
        var data = this.props.entry.get('data');
        var getAsset = this.props.getAsset;
        var get = function (k) { var v = data.get(k); return v == null ? '' : v; };

        // Con varias fotos Decap devuelve una lista Immutable; con UNA sola, un string
        var fotos = data.get('fotos');
        var fotoPath = null;
        if (fotos && typeof fotos.size === 'number') fotoPath = fotos.size ? fotos.get(0) : null;
        else if (typeof fotos === 'string' && fotos.trim()) fotoPath = fotos.trim();
        var tipo = get('tipo');
        var ubic = [get('zona'), get('localidad')].filter(Boolean).join(' · ');

        var stats = [];
        function st(v, suf) { if (v !== '' && v != null) stats.push(String(v) + suf); }
        st(get('metros_cuadrados'), ' m² tot.'); st(get('metros_cubiertos'), ' m² cub.');
        st(get('metros_terreno'), ' m² terreno'); st(get('ambientes'), ' amb.');
        st(get('dormitorios'), ' dorm.'); st(get('banos'), Number(get('banos')) === 1 ? ' baño' : ' baños');
        st(get('antiguedad'), ' años');

        return h('div', { className: 'sp' }, [
          h('div', { className: 'sp-photo' }, [
            fotoPath ? h('img', { src: getAsset(fotoPath) }) : h('div', { className: 'sp-nophoto' }, 'Sin foto'),
            tipo ? h('span', { className: 'sp-tipo' }, tipo) : null,
            data.get('destacada') ? h('span', { className: 'sp-dest' }, '★ Destacada') : null
          ]),
          h('h1', { className: 'sp-titulo' }, get('titulo') || 'Título de la propiedad'),
          ubic ? h('div', { className: 'sp-ubicline' }, '📍 ' + ubic) : null,
          h('div', { className: 'sp-precio' }, fmtPrecio(get('precio'), get('moneda'), tipo, get('periodo'))),
          stats.length ? h('div', { className: 'sp-stats' }, stats.map(function (s) { return h('span', { className: 'sp-stat' }, s); })) : null,
          chipGroup('Servicios', data.get('servicios')),
          chipGroup('Ambientes', data.get('ambientes_detalle')),
          chipGroup('Características', data.get('caracteristicas')),
          get('descripcion') ? h('div', { className: 'sp-desc' }, renderDesc(get('descripcion'))) : null
        ]);
      }
    });

    CMS.registerPreviewStyle(
      "@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;700&family=Archivo+Black&display=swap');" +
      "body{margin:0;background:#FFFCEB;}" +
      ".sp{font-family:'Archivo',sans-serif;color:#1E1E1E;padding:30px;max-width:580px;}" +
      ".sp-photo{position:relative;width:100%;aspect-ratio:16/9;background:#36512B;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:20px;}" +
      ".sp-photo img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;}" +
      ".sp-nophoto{color:rgba(255,252,235,0.6);font-size:13px;letter-spacing:0.1em;text-transform:uppercase;}" +
      ".sp-tipo{position:absolute;top:12px;left:12px;background:#36512B;color:#FFFCEB;font-size:9px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;padding:4px 10px;border-radius:2px;}" +
      ".sp-dest{position:absolute;top:12px;right:12px;background:#EE7A13;color:#FFFCEB;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;padding:4px 10px;border-radius:2px;}" +
      ".sp-titulo{font-family:'Archivo Black',sans-serif;font-size:30px;line-height:1.15;margin:0 0 18px;}" +
      ".sp-sup{font-family:'Archivo Black',sans-serif;line-height:1;margin-bottom:16px;}" +
      ".sp-sup-n{font-size:34px;}.sp-sup-u{font-size:18px;color:#6b6860;}" +
      ".sp-ubic{display:flex;gap:40px;margin-bottom:22px;flex-wrap:wrap;}" +
      ".sp-lbl{display:block;font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#6b6860;margin-bottom:3px;}" +
      ".sp-val{font-size:16px;font-weight:500;}" +
      ".sp-ubicline{font-size:15px;color:#6b6860;margin-bottom:14px;}" +
      ".sp-precio{font-family:'Archivo Black',sans-serif;font-size:30px;color:#36512B;margin-bottom:16px;}" +
      ".sp-stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}" +
      ".sp-stat{font-size:13px;font-weight:600;color:#36512B;background:#eef0e6;border:1px solid #dfe3d4;border-radius:999px;padding:5px 12px;}" +
      ".sp-group{margin-bottom:18px;}" +
      ".sp-group-t{font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#36512B;margin-bottom:8px;}" +
      ".sp-tags{display:flex;flex-wrap:wrap;gap:8px;}" +
      ".sp-tag{font-size:13px;font-weight:600;color:#1E1E1E;background:#fff;border:1px solid #dfe3d4;border-radius:999px;padding:5px 12px;}" +
      ".sp-desc{margin-top:6px;}" +
      ".sp-desc{font-size:16px;line-height:1.8;color:#444;}" +
      ".sp-desc p{margin:0 0 12px;}" +
      ".sp-desc ul{padding-left:0;list-style:none;margin:0 0 12px;}" +
      ".sp-desc li{position:relative;padding:8px 0 8px 22px;border-bottom:1px solid #e4e0d0;}" +
      ".sp-desc li:last-child{border-bottom:none;}" +
      ".sp-desc li::before{content:'—';position:absolute;left:0;color:#EE7A13;}",
      { raw: true }
    );

    CMS.registerPreviewTemplate('propiedades', Preview);
  })();
  </script>
</body>
</html>
