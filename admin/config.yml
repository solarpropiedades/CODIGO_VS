backend:
  name: git-gateway
  branch: main

media_folder: "fotos/propiedades"
public_folder: "/fotos/propiedades"

locale: es

# Logo de Solar en la pantalla de login y el header del panel
logo_url: /fotos/LOGO.PNG

collections:
  - name: propiedades
    label: Propiedades
    label_singular: Propiedad
    folder: content/propiedades
    create: true
    slug: "{{fields.codigo}}"
    identifier_field: codigo
    summary: "{{fields.codigo}} — {{fields.titulo}}"
    thumbnail: fotos
    fields:
      - label: "Código"
        name: codigo
        widget: string
        required: true
        hint: "Ej: LO-615"

      - label: "Título"
        name: titulo
        widget: string
        required: true

      - label: "Tipo"
        name: tipo
        widget: select
        options:
          - { label: "Lotes", value: "Lote" }
          - { label: "Casas", value: "Casa" }
          - { label: "Departamentos", value: "Departamento" }
          - { label: "Alquileres permanentes", value: "Alquiler permanente" }
          - { label: "Alquileres turísticos", value: "Alquiler turístico" }
        required: true

      - label: "Precio"
        name: precio
        widget: string
        required: true
        hint: "Ej: 85000"

      - label: "Moneda"
        name: moneda
        widget: select
        options:
          - USD
          - ARS
        default: "USD"

      - label: "Período del precio (solo alquileres)"
        name: periodo
        widget: string
        required: false
        hint: "Solo para alquileres: cada cuánto es el precio. Escribilo libre. Ej: mes, noche, día, semana, quincena, temporada. Si lo dejás vacío en un alquiler, se muestra 'por mes'."

      - label: "Mostrar también el precio convertido"
        name: mostrar_precio_convertido
        widget: boolean
        default: true
        hint: "Si está activado, en el listado se muestra el precio que cargaste y abajo el equivalente aproximado en la otra moneda (según el valor del dólar). Desactivalo si querés mostrar SOLO la moneda que cargaste (ej: alquileres en pesos)."

      - label: "Superficie total (m²)"
        name: metros_cuadrados
        widget: number
        required: false
        value_type: int
        min: 0
        hint: "Metros cuadrados totales"

      - label: "Superficie cubierta (m²)"
        name: metros_cubiertos
        widget: number
        required: false
        value_type: int
        min: 0

      - label: "Superficie semicubierta (m²)"
        name: metros_semicubiertos
        widget: number
        required: false
        value_type: int
        min: 0
        hint: "Balcones, galerías, quinchos abiertos, etc."

      - label: "Superficie del terreno (m²)"
        name: metros_terreno
        widget: number
        required: false
        value_type: int
        min: 0

      - label: "Ambientes (número)"
        name: ambientes
        widget: number
        required: false
        value_type: int
        min: 0

      - label: "Ambientes (detalle)"
        name: ambientes_detalle
        widget: text
        required: false
        hint: "Escribí los ambientes separados por coma (podés usar espacios). Ej: Living, Cocina, Comedor, Dormitorio principal, Baño, Patio."

      - label: "Dormitorios"
        name: dormitorios
        widget: number
        required: false
        value_type: int
        min: 0

      - label: "Baños"
        name: banos
        widget: number
        required: false
        value_type: int
        min: 0

      - label: "Antigüedad (años)"
        name: antiguedad
        widget: number
        required: false
        value_type: int
        min: 0
        hint: "Años de antigüedad. Dejar vacío si es a estrenar."

      - label: "Zona / Barrio"
        name: zona
        widget: string
        required: false
        hint: "Ej: Barrio Norte"

      - label: "Localidad"
        name: localidad
        widget: string
        required: false
        hint: "Ej: Villa La Angostura"

      - label: "Coordenadas (Google Maps)"
        name: coordenadas
        widget: string
        required: false
        hint: "Pegá las coordenadas de Google Maps. Ej: -40.749944, -71.656222 o 40°44'59.8\"S 71°39'22.4\"W"

      - label: "Servicios"
        name: servicios
        widget: text
        required: false
        hint: "Escribí los servicios separados por coma (podés usar espacios). Ej: Luz, Gas natural, Agua corriente, Cloacas, Internet."

      - label: "Características"
        name: caracteristicas
        widget: text
        required: false
        hint: "Escribí las características separadas por coma (podés usar espacios). Ej: Cochera, Pileta, Vista al lago, Apto crédito. Se muestran en la ficha y se filtran en el buscador."

      - label: "Descripción"
        name: descripcion
        widget: markdown
        required: false
        hint: "Podés usar Enter para separar párrafos, - para listas, **negrita**, etc."

      - label: "Fotos"
        name: fotos
        widget: image
        multiple: true
        required: false
        # default [] fuerza a Decap a tratar el campo como LISTA desde el principio.
        # Sin esto, al subir UNA sola foto guardaba un texto suelto en vez de una lista
        # y despues no dejaba agregar mas (bug conocido de Decap, issue #5812).
        default: []
        hint: "Podés seleccionar/arrastrar varias fotos a la vez. La primera es la principal."

      - label: "Link Reel / Video"
        name: link_reel
        widget: string
        required: false
        hint: "Link a reel de Instagram o video de YouTube"

      - label: "Destacada"
        name: destacada
        widget: boolean
        default: false
        hint: "Activar para que aparezca en el home"

  # ── Configuración general del sitio (un solo archivo editable) ──
  - name: configuracion
    label: "Configuración General"
    files:
      - name: general
        label: "Valores del sitio"
        file: content/config/general.json
        fields:
          - label: "Valor del dólar (en pesos)"
            name: valor_dolar
            widget: number
            value_type: float
            required: false
            min: 0
            hint: "Cuántos pesos vale 1 dólar (ej: 1350). Se usa para convertir precios entre USD y ARS en las búsquedas."

          - label: "Última actualización"
            name: fecha_actualizacion
            widget: datetime
            date_format: "DD/MM/YYYY"
            time_format: false
            required: false
            hint: "Para que sepas cuándo actualizaste el valor por última vez."
